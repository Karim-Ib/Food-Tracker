[project]
name = "foodbot"
version = "0.1.0"
description = "Personal food tracking via Telegram bot"
requires-python = ">=3.12"
dependencies = [
    # Web framework
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",

    # Database
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30",            # async driver — used by FastAPI at runtime
    "psycopg[binary]>=3.2",     # sync driver — used by Alembic for migrations
    "alembic>=1.14",

    # Validation and config
    "pydantic>=2.10",
    "pydantic-settings>=2.6",

    #http client
    "httpx>=0.28.0",

    #telegram
    "python-telegram-bot[ext]>=21.9",

    # Logging
    "structlog>=24.4",

    # LLM
    "google-genai>=0.8",

    "pyzbar>=0.1.9",
    "Pillow>=10.0",

    # Weight-trend model and chart (API only — the shared manifest installs
    # them into the bot image too, which is the cost of one dependency file)
    "numpy>=2.1",
    "pandas>=2.2",
    "matplotlib>=3.9"
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.8",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = []

[tool.pytest.ini_options]
# `app` lives under api/, so tests import app.services.* without an install.
pythonpath = ["api"]
testpaths = ["api/tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N"]